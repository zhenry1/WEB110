<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <title>Random Movie Quote Generator</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding: 50px;
      min-height: 100vh;
    }
    h1 { font-size: 3rem; margin-bottom: 20px; }
    #generateContainer {
      margin: 20px 0;
    }

    #quoteMessage {
        font-size: 2rem;
        font-family: 'Georgia', serif;
        font-weight: italic;
        margin-bottom: 10px;
        line-height: 1.3;
    }

    #quoteAuthor {
        font-size: 1.8rem;
        font-family: 'Segoe UI', sans-serif;
        font-style: italic;
        color: #555;
        margin-top: 0;
    }

    .quote-btn {
      padding: 15px 75px;
      margin: 8px;
      font-size: 2rem;
      cursor: pointer;
      border: none;
      border-radius: 8px;
      transition: transform 0.2s;
    }
    .quote-btn:hover { transform: scale(1.05); }
    #quoteDisplay { margin-top: 30px; font-size: 1.5rem; font-style: italic; }
  </style>
</head>

<body>
  <h1>Random Movie Quote Generator</h1>
  
  <p id="quoteMessage">Quote will go here</p>
  <p id="quoteAuthor">- Movie Origin</p>

  <!-- Button container -->
  <div id="generateContainer">
    <button class="quote-btn" data-quote="happy">Generate</button>
  </div>

  <script src="quoteselect.js"></script>
</body>
</html>
